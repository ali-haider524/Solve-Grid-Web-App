name: SolveGrid SEO Monitor

on:
  workflow_dispatch:
  schedule:
    # Tuesday-Sunday: Search Console + GA4 + indexing monitor.
    - cron: "17 4 * * 2-7"
    # Monday: same monitor plus PageSpeed checks.
    - cron: "47 4 * * 1"

permissions:
  contents: read

concurrency:
  group: solvegrid-seo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      SEO_INDEXING_ENABLED: "true"
      PAGESPEED_ENABLED: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * 1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate SEO monitor configuration
        run: node scripts/seo/validate-config.mjs

      - name: Run analyzer tests
        run: node scripts/seo/test-analyzer.mjs

      - name: Collect SEO data and recommendations
        run: node scripts/seo/run-monitor.mjs

      - name: Upload SEO report artifact
        uses: actions/upload-artifact@v4
        with:
          name: solvegrid-seo-report-${{ github.run_id }}
          path: seo-output/
          if-no-files-found: error
          retention-days: 30
